name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: timora_test
          POSTGRES_USER: timora_test
          POSTGRES_PASSWORD: timora_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U timora_test -d timora_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run verify:testcases
