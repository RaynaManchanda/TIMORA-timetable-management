# TIMORA stack: PostgreSQL 16 + the API (Prisma, pg connection pool).
#
#   docker compose up -d --wait db     only the database (develop with "npm run dev" on your machine)
#   docker compose up --build          database + API + frontend on http://localhost:3000
#
# Required (set them in .env or your shell): POSTGRES_PASSWORD, JWT_SECRET (32+ characters).
# The API applies the Prisma migrations itself and imports data/*.xlsx on start-up.

services:
  db:
    image: postgres:16-alpine
    container_name: timora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timora_db}
      POSTGRES_USER: ${POSTGRES_USER:-timora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # 5434 on the host avoids a clash with a PostgreSQL that is already installed on port 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timora_user} -d ${POSTGRES_DB:-timora_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: timora-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-timora_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-timora_db}?schema=public
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      IMPORT_ON_START: ${IMPORT_ON_START:-true}
      AI_API_KEY: ${AI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:${API_PORT:-3000}/}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  pgdata:
